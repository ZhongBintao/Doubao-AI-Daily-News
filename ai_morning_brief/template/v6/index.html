<style>
/* AI每日早报 · v6 vertical template (1080x1920). Design record: docs/design/v6-vertical-template.md */
@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC-VF.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
:root {
  --paper: #f7f4ee; --card: #fffefa; --ink: #20282b; --muted: #6d7371; --line: #dedbd2;
  --terracotta: #cf704a; --terracotta-dark: #a75a3b; --teal: #3f7376; --amber: #9a6f17; --red: #b84a3e;
  --accent: var(--terracotta); --accent-dark: var(--terracotta-dark); --accent-soft: rgba(207,112,74,.12);
  --font: "Noto Sans SC", "WenQuanYi Zen Hei", sans-serif;
  --safe-l: 64px; --safe-r: 150px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); font-family: var(--font); -webkit-font-smoothing: antialiased; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); color: var(--ink); }
.scene { position: absolute; inset: 0; overflow: hidden; background: var(--paper); opacity: 0; visibility: hidden; will-change: opacity, transform; }
.scene::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(circle at 88% 12%, rgba(207,112,74,.16), rgba(207,112,74,0) 34%),
    linear-gradient(rgba(32,40,43,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(32,40,43,.04) 1px, transparent 1px);
  background-size: auto, 72px 72px, 72px 72px; }
.cat-ai-models, .cat-ai-products { --accent: var(--terracotta); --accent-dark: var(--terracotta-dark); --accent-soft: rgba(207,112,74,.12); }
.cat-industry { --accent: var(--teal); --accent-dark: #2d5759; --accent-soft: rgba(63,115,118,.12); }
.cat-paper { --accent: var(--amber); --accent-dark: #7a5710; --accent-soft: rgba(154,111,23,.12); }
.cat-tip, .cat-opinion, .cat-other { --accent: var(--red); --accent-dark: #8f3830; --accent-soft: rgba(184,74,62,.12); }
.orbit { position: absolute; width: 760px; height: 760px; right: -260px; top: 140px; border: 1px solid rgba(63,115,118,.18); border-radius: 50%; pointer-events: none; }
.orbit::before, .orbit::after { content: ""; position: absolute; inset: 70px; border: 1px dashed rgba(207,112,74,.24); border-radius: 50%; }
.orbit::after { inset: 180px; border: 1px solid rgba(232,172,59,.24); }

.header { position: absolute; top: 196px; left: var(--safe-l); right: var(--safe-r); height: 64px; display: flex; align-items: center; justify-content: space-between; z-index: 3; }
.wordmark { display: flex; align-items: center; gap: 14px; font: 900 34px/1 var(--font); color: var(--terracotta); letter-spacing: -.01em; }
.wordmark .rule { width: 10px; height: 34px; border-radius: 99px; background: var(--terracotta); }
.wordmark .date { font: 700 26px/1 var(--font); color: var(--muted); letter-spacing: .04em; }
.progress { display: flex; align-items: center; gap: 14px; font: 800 26px/1 var(--font); color: var(--teal); letter-spacing: .06em; }
.progress .segs { display: flex; gap: 6px; }
.progress .segs i { width: 30px; height: 8px; border-radius: 99px; background: rgba(63,115,118,.2); }
.progress .segs i.on { background: var(--teal); }

.body { position: absolute; left: var(--safe-l); right: var(--safe-r); top: 300px; bottom: 572px; display: flex; flex-direction: column; z-index: 2; }
.kind-hook .body, .kind-flash .body, .kind-outro .body { justify-content: center; padding-bottom: 40px; }
.kicker-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.kicker { padding: 10px 20px 11px; border-radius: 12px; background: var(--accent); color: #fff; font: 900 30px/1 var(--font); letter-spacing: .08em; }
.kicker.teal { background: var(--teal); }
.section { color: var(--teal); font: 800 26px/1.2 var(--font); letter-spacing: .08em; }
.subject { display: inline-flex; align-items: center; height: 72px; padding: 0 22px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); box-shadow: 0 10px 24px rgba(32,40,43,.07); font: 900 34px/1 var(--font); color: var(--ink); letter-spacing: -.01em; white-space: nowrap; }
.subject img { height: 40px; display: block; }

.hook-title { margin-top: 40px; color: var(--ink); font-weight: 900; font-size: 118px; line-height: 1.12; letter-spacing: -.02em; }
.hook-title em { font-style: normal; color: var(--accent); background-image: linear-gradient(var(--accent-soft), var(--accent-soft)); background-repeat: no-repeat; background-position: 0 88%; background-size: var(--sweep, 100%) 38%; }
.hook-rule { width: 104px; height: 10px; border-radius: 99px; background: var(--accent); margin: 44px 0 34px; transform-origin: left center; }
.keyfact { padding: 30px 34px 32px; border: 1px solid var(--line); border-radius: 28px; background: var(--card); box-shadow: 0 18px 36px rgba(32,40,43,.09); }
.keyfact .label, .flash-card .label { color: var(--teal); font: 800 26px/1 var(--font); letter-spacing: .06em; margin-bottom: 14px; }
.keyfact p { font: 600 38px/1.45 var(--font); letter-spacing: -.01em; }

.story-title { margin-top: 26px; color: var(--accent); font-weight: 900; font-size: 68px; line-height: 1.16; letter-spacing: -.03em; }
.story-meta { margin-top: 24px; display: flex; align-items: center; gap: 16px; }
.cards { position: relative; margin-top: 34px; flex: 1 1 auto; }
.cards-inner { display: flex; flex-direction: column; gap: 22px; }
.card { display: flex; gap: 22px; align-items: flex-start; padding: 26px 28px 28px; border: 2px solid transparent; border-radius: 26px; background: var(--card); box-shadow: 0 14px 30px rgba(32,40,43,.08); outline: 1px solid var(--line); outline-offset: -1px; }
.card.is-speaking { border-color: var(--accent); outline-color: transparent; box-shadow: 0 22px 44px rgba(32,40,43,.14); }
.card.is-done { opacity: .7; }
.card .icon { flex: 0 0 56px; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }
.card .icon svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.card .copy { min-width: 0; flex: 1; }
.card .label { color: var(--teal); font: 800 24px/1 var(--font); letter-spacing: .06em; margin-bottom: 10px; }
.card h3 { color: var(--accent-dark); font: 900 40px/1.18 var(--font); letter-spacing: -.02em; margin-bottom: 10px; }
.card p { font: 500 31px/1.45 var(--font); letter-spacing: -.01em; overflow-wrap: anywhere; }
.cards.compact .cards-inner { gap: 16px; }
.cards.compact .card { padding: 20px 24px 22px; }
.cards.compact .card h3 { font-size: 35px; margin-bottom: 8px; }
.cards.compact .card p { font-size: 28px; line-height: 1.42; }
.hl { padding: 0 .14em; border-radius: 8px; color: var(--red); background: #fff0e8; font-weight: 800; }
.page-dots { margin-top: 18px; display: flex; gap: 10px; }
.page-dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(63,115,118,.25); }
.page-dots i.on { background: var(--teal); }

.flash-card { margin-top: 40px; padding: 36px 36px 40px; border-radius: 30px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 18px 36px rgba(32,40,43,.09); }
.flash-card p { font: 600 38px/1.48 var(--font); }

.outro-mark { color: var(--terracotta); font: 900 112px/1.1 var(--font); letter-spacing: -.02em; }
.outro-rule { width: 104px; height: 10px; border-radius: 99px; background: var(--terracotta); margin: 40px 0 34px; }
.outro-text { font: 800 50px/1.4 var(--font); color: var(--ink); }
.outro-sub { margin-top: 22px; font: 600 32px/1.4 var(--font); color: var(--muted); }

.captions { position: absolute; left: var(--safe-l); right: var(--safe-r); top: 1372px; z-index: 20; text-align: center; }
.cap { position: absolute; left: 0; right: 0; top: 0; text-align: center; opacity: 0; visibility: hidden; }
.cap span { font: 800 46px/1.5 var(--font); color: #fff; background: rgba(32,40,43,.93); padding: 8px 20px; border-radius: 12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

.hook-title, .story-title, .keyfact p, .flash-card p, .card p, .cap { text-wrap: balance; }
.w { white-space: nowrap; }
</style>

<body>
<div id="root" data-composition-id="root" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920" data-fps="30">
__BODY__

<script id="layout-script">
/* Layout prepass. Runs once in headless Chrome (see render.py); the result is
   serialized back into index.html, so the render page never measures text. */
(function () {
  if (location.hash !== "#layout") return;
  const self = document.getElementById("layout-script");
  const seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("zh", { granularity: "word" }) : null;
  const ASCII = /^[A-Za-z0-9.\-+%#_/]+$/, NUMERAL = /^([0-9]+(\.[0-9]+)?|[一二三四五六七八九十百千万两几]+)$/, MEASURE = /^[个款家倍条项位名亿万次年月日天层份张]$/;
  const PUNCT = /^[，。！？、：；,.!?:;”’）)》」』%％]+$/, HAN1 = /^[一-鿿]$/;
  const words = (text) => {
    if (!seg) return [text];
    const out = [];
    let pairOpen = false;  // the last pushed word is a single Han char that may pair with the next one
    for (const { segment } of seg.segment(text)) {
      const prev = out[out.length - 1];
      if (prev && !/\s/.test(segment) && ((ASCII.test(prev) && ASCII.test(segment)) || (NUMERAL.test(prev) && MEASURE.test(segment)) || PUNCT.test(segment))) {
        out[out.length - 1] = prev + segment; pairOpen = false; continue;
      }
      // ICU's Chinese dictionary misses many tech words (开源, 九个…): pair up runs of single Han characters.
      if (prev && pairOpen && HAN1.test(segment)) { out[out.length - 1] = prev + segment; pairOpen = false; continue; }
      out.push(segment);
      pairOpen = HAN1.test(segment);
    }
    return out;
  };
  const wrapWords = (el) => {
    [...el.childNodes].forEach((child) => {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const segment of words(child.textContent)) {
          if (/^\s+$/.test(segment)) { frag.appendChild(document.createTextNode(segment)); continue; }
          const span = document.createElement("span"); span.className = "w"; span.textContent = segment; frag.appendChild(span);
        }
        child.replaceWith(frag);
      } else if (child.nodeType === 1 && !child.classList.contains("w")) wrapWords(child);
    });
  };
  const fit = (el) => {
    const max = +el.dataset.max, min = +el.dataset.min, lines = +el.dataset.lines;
    for (let size = max; size >= min; size -= 2) {
      el.style.fontSize = size + "px";
      const lh = parseFloat(getComputedStyle(el).lineHeight);
      if (el.scrollHeight <= lh * lines + 2 && el.scrollWidth <= el.clientWidth + 1) break;
    }
  };
  const run = () => {
    const report = { scenes: [] };
    document.querySelectorAll(".scene").forEach((scene) => { scene.style.visibility = "visible"; scene.style.opacity = "1"; });
    document.querySelectorAll(".hook-title, .story-title, .keyfact p, .card h3, .card p, .flash-card p").forEach(wrapWords);
    document.querySelectorAll(".fit").forEach(fit);
    document.querySelectorAll(".scene.kind-story").forEach((scene) => {
      const body = scene.querySelector(".body"), cards = scene.querySelector(".cards"), inner = scene.querySelector(".cards-inner");
      const all = [...inner.querySelectorAll(".card")];
      const limit = () => body.getBoundingClientRect().bottom - 40;
      const paginate = () => {
        let page = 0, pageStartTop = null, count = 0;
        all.forEach((card) => card.style.display = "");
        const pages = [];
        all.forEach((card) => {
          card.dataset.page = String(page);
          card.style.display = "";
          // hide previous pages to measure the current one in place
          all.forEach((c) => { if (+c.dataset.page < page) c.style.display = "none"; });
          if ((card.getBoundingClientRect().bottom > limit() || count >= 3) && count > 0) {
            page += 1; count = 0; card.dataset.page = String(page);
            all.forEach((c) => { if (+c.dataset.page < page) c.style.display = "none"; });
          }
          count += 1;
        });
        all.forEach((c) => c.style.display = "");
        return page + 1;
      };
      let pages = paginate();
      if (pages > Math.ceil(all.length / 3) || all.some((c) => c.getBoundingClientRect().bottom > limit())) {
        cards.classList.add("compact");
        pages = paginate();
      }
      cards.dataset.pages = String(pages);
      if (pages > 1) {
        const dots = document.createElement("div"); dots.className = "page-dots";
        for (let i = 0; i < pages; i++) { const d = document.createElement("i"); d.dataset.dot = String(i); dots.appendChild(d); }
        cards.after(dots);
      }
      report.scenes.push({ id: scene.id, pages, compact: cards.classList.contains("compact") });
    });
    const overflow = [...document.querySelectorAll(".fit, .card p, .keyfact p, .flash-card p, .subject")].filter((e) => e.scrollWidth > e.clientWidth + 1).map((e) => e.textContent.slice(0, 24));
    report.overflow = overflow;
    document.querySelectorAll(".scene").forEach((scene) => { scene.style.visibility = ""; scene.style.opacity = ""; });
    document.documentElement.dataset.layout = JSON.stringify(report);
    self.remove();
  };
  document.fonts.ready.then(() => setTimeout(run, 50));
})();
</script>

<script id="timeline-script">
/* Deterministic timeline: seek(t) sets every visual state from scratch. */
(function () {
  const DATA = JSON.parse(document.getElementById("v6-data").textContent);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = (p) => 1 - Math.pow(1 - clamp(p), 3);
  const scenes = DATA.scenes.map((s) => ({ ...s, el: document.getElementById(s.scene_id) }));
  const caps = [...document.querySelectorAll(".cap")].map((el) => ({ el, start: +el.dataset.start, end: +el.dataset.end }));
  const TRANSITION = 0.32;
  const show = (el, p, dy = 26) => { el.style.opacity = String(ease(p)); el.style.transform = `translate3d(0, ${(1 - ease(p)) * dy}px, 0)`; };
  function seek(t) {
    scenes.forEach((s, i) => {
      const el = s.el; if (!el) return;
      const nextStart = i + 1 < scenes.length ? scenes[i + 1].start : Infinity;
      const visible = t >= s.start && t < nextStart + TRANSITION;
      el.style.visibility = visible ? "visible" : "hidden";
      el.style.zIndex = String(10 + i);
      if (!visible) { el.style.opacity = "0"; return; }
      const local = t - s.start;
      const enter = i === 0 ? 1 : clamp(local / TRANSITION);
      el.style.opacity = String(ease(enter));
      el.style.transform = i === 0 ? "none" : `translate3d(0, ${(1 - ease(enter)) * 40}px, 0)`;
      const orbit = el.querySelector(".orbit"); if (orbit) orbit.style.transform = `rotate(${(t * 3).toFixed(2)}deg)`;
      if (s.kind === "hook") {
        el.style.setProperty("--sweep", (ease((local - 0.15) / 0.55) * 100).toFixed(1) + "%");
        const rule = el.querySelector(".hook-rule"); if (rule) rule.style.transform = `scaleX(${ease((local - 0.2) / 0.4).toFixed(3)})`;
        const kf = el.querySelector(".keyfact"); if (kf) show(kf, (local - 0.5) / 0.4);
      } else if (s.kind === "story") {
        const title = el.querySelector(".story-title"); if (title) show(title, (local - 0.05) / 0.35, 20);
        const meta = el.querySelector(".story-meta"); if (meta) show(meta, (local - 0.15) / 0.35, 16);
        const events = (DATA.card_events[s.scene_id] || []);
        let active = 0, activeStart = s.start;
        events.forEach((ev) => { if (t >= ev.start - 0.05) { active = ev.card; activeStart = ev.start; } });
        const cards = [...el.querySelectorAll(".card")];
        const activeCard = cards[Math.max(0, active - 1)];
        const page = activeCard ? +(activeCard.dataset.page || 0) : 0;
        const firstSeen = {};
        events.forEach((ev) => { if (!(ev.card in firstSeen)) firstSeen[ev.card] = ev.start; });
        cards.forEach((card, k) => {
          const n = k + 1, onPage = +(card.dataset.page || 0) === page;
          card.style.display = onPage ? "" : "none";
          const appear = (firstSeen[n] ?? s.start + 0.4) - 0.12;
          const pageStart = cards.filter((c) => +(c.dataset.page || 0) === page).map((c, j) => firstSeen[cards.indexOf(c) + 1] ?? Infinity).reduce((a, b) => Math.min(a, b), Infinity);
          const shown = t >= appear || (n === 1 && local >= 0.4);
          const p = shown ? (t - Math.max(appear, s.start + 0.3)) / 0.35 : 0;
          card.style.opacity = shown ? String(ease(p) * (n < active ? 0.7 : 1)) : "0";
          card.style.transform = `translate3d(${n === active ? 10 : 0}px, ${(1 - ease(p)) * 30}px, 0)`;
          card.classList.toggle("is-speaking", n === active);
          card.classList.remove("is-done");
        });
        el.querySelectorAll(".page-dots i").forEach((dot) => dot.classList.toggle("on", +dot.dataset.dot === page));
      } else if (s.kind === "flash") {
        const title = el.querySelector(".story-title"); if (title) show(title, (local - 0.05) / 0.35, 20);
        const meta = el.querySelector(".story-meta"); if (meta) show(meta, (local - 0.15) / 0.35, 16);
        const card = el.querySelector(".flash-card"); if (card) show(card, (local - 0.45) / 0.4);
      } else if (s.kind === "outro") {
        const mark = el.querySelector(".outro-mark"); if (mark) show(mark, local / 0.4, 30);
        const text = el.querySelector(".outro-text"); if (text) show(text, (local - 0.3) / 0.4);
        const sub = el.querySelector(".outro-sub"); if (sub) show(sub, (local - 0.5) / 0.4);
      }
    });
    caps.forEach((c) => { const on = t >= c.start && t < c.end; c.el.style.opacity = on ? "1" : "0"; c.el.style.visibility = on ? "visible" : "hidden"; });
  }
  let current = 0;
  const tl = {
    seek(t) { current = Math.max(0, +t || 0); seek(current); return tl; },
    time(v) { return v === undefined ? current : tl.seek(v); },
    totalTime(v) { return v === undefined ? current : tl.seek(v); },
    progress(v) { return v === undefined ? current / DATA.total_duration : tl.seek(v * DATA.total_duration); },
    duration: () => DATA.total_duration, totalDuration: () => DATA.total_duration,
    pause: () => tl, play: () => tl, kill: () => tl, paused: () => true, timeScale: () => tl, getChildren: () => [],
  };
  window.__timelines = window.__timelines || {};
  window.__timelines.root = tl;
  if (location.hash !== "#layout") tl.seek(0);
})();
</script>
