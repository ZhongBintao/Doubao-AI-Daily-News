/* AI每日早报 · v6 vertical template (1080x1920). Design record: docs/design/v6-vertical-template.md */
@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC-VF.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
:root {
  /* Palette A (2026-11-04): colour follows the section, not the news category.
     Headlines = warm clay orange, flashes = navy; everything else is shared ink / grey on warm paper. */
  --paper: #f7f4ee; --card: #fffefa; --ink: #1f2629; --muted: #737a77; --line: #e3ded4;
  --brand: #d0643a; --brand-dark: #a5441d;
  --head: #d0643a; --head-dark: #a5441d; --head-soft: rgba(208,100,58,.13); --head-glow: rgba(208,100,58,.17);
  --flash: #2d5b8c; --flash-dark: #1d3f66; --flash-soft: rgba(45,91,140,.11); --flash-glow: rgba(45,91,140,.15);
  --accent: var(--head); --accent-dark: var(--head-dark); --accent-soft: var(--head-soft); --glow: var(--head-glow);

  --safe-l: 64px; --safe-r: 150px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); font-family: var(--font); -webkit-font-smoothing: antialiased; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); color: var(--ink); }
.scene { position: absolute; inset: 0; overflow: hidden; background: var(--paper); opacity: 0; visibility: hidden; will-change: opacity, transform; }
.scene::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(circle at 88% 12%, var(--glow), rgba(0,0,0,0) 36%),
    linear-gradient(rgba(31,38,41,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(31,38,41,.035) 1px, transparent 1px);
  background-size: auto, 72px 72px, 72px 72px; }
.kind-flash { --accent: var(--flash); --accent-dark: var(--flash-dark); --accent-soft: var(--flash-soft); --glow: var(--flash-glow); }
.orbit { position: absolute; width: 760px; height: 760px; right: -260px; top: 140px; border: 1px solid rgba(31,38,41,.10); border-radius: 50%; pointer-events: none; }
.orbit::before, .orbit::after { content: ""; position: absolute; inset: 70px; border: 1px dashed rgba(208,100,58,.24); border-radius: 50%; }
.orbit::after { inset: 180px; border: 1px solid rgba(208,100,58,.16); }
/* Brand backdrop (scheme A): the story's logo as a one-colour silhouette in the section colour, enlarged,
   bleeding off the bottom-right edge; above the paper grid, below the content (.body is z-index 2).
   Size, position and opacity are written inline by render.backdrop_geometry (config.BACKDROP_*). */
.backdrop { position: absolute; z-index: 0; pointer-events: none; user-select: none; }

/* One persistent header above every scene (scenes cross-fade underneath it). */
.chrome { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
.header { position: absolute; top: 196px; left: var(--safe-l); right: var(--safe-r); height: 64px; display: flex; align-items: center; justify-content: space-between; }
.wordmark { display: flex; align-items: center; gap: 14px; font: 900 36px/1 var(--font); color: var(--brand); letter-spacing: -.01em; }
.wordmark .rule { width: 10px; height: 36px; border-radius: 99px; background: var(--brand); }
.wordmark .date { font: 700 28px/1 var(--font); color: var(--muted); letter-spacing: .04em; }
.progress { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: none; align-items: center; gap: 14px; font: 800 28px/1 var(--font); color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
.progress.on { display: flex; }

.body { position: absolute; left: var(--safe-l); right: var(--safe-r); top: 300px; bottom: 572px; display: flex; flex-direction: column; z-index: 2; }
.kind-hook .body, .kind-flash .body, .kind-outro .body { justify-content: center; padding-bottom: 30px; }
.kicker-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.kicker { padding: 10px 20px 11px; border-radius: 12px; background: var(--accent); color: #fff; font: 900 30px/1 var(--font); letter-spacing: .08em; }

.hook-rule { width: 104px; height: 10px; border-radius: 99px; background: var(--accent); margin: 44px 0 34px; transform-origin: left center; }

.card.is-speaking { border-color: var(--accent); outline-color: transparent; box-shadow: 0 22px 44px rgba(32,40,43,.15); }
.card .icon { flex: 0 0 60px; width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }

.card .copy { min-width: 0; flex: 1; padding-top: 6px; }
.card .label { color: var(--muted); font: 800 27px/1 var(--font); letter-spacing: .06em; margin: 4px 0 12px; }
.card h3 { color: var(--ink); font: 900 46px/1.18 var(--font); letter-spacing: -.02em; }
.card p { font: 500 35px/1.45 var(--font); letter-spacing: -.01em; overflow-wrap: anywhere; }
/* Headline cards: the one being narrated is expanded; the rest of the page shows its headline only. */
.card .more { display: grid; grid-template-rows: 1fr; }
.card .more > div { min-height: 0; overflow: hidden; }
.card .more p { padding-top: 12px; }
.card.is-collapsed .more { grid-template-rows: 0fr; }

.cards.compact .card { padding: 22px 26px 24px; }
.cards.compact .card h3 { font-size: 42px; }
.cards.compact .card p { font-size: 32px; line-height: 1.42; }
.hl { padding: 0 .14em; border-radius: 8px; color: var(--accent-dark); background: var(--accent-soft); font-weight: 800; }
.page-dots { margin-top: 18px; display: flex; gap: 10px; }

.page-dots i.on { background: var(--accent); }

/* Flash: "what happened" + "so what" cards, larger type, no headline row. */
.kind-flash .story-title { margin-top: 30px; }
.card.flash-card { padding: 32px 34px 36px; }
/* the "so what" card: same section colour, lightly tinted, so the two flash cards read as fact -> meaning */
.card.flash-card.why { background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--card); }
.card.flash-card p { font: 600 40px/1.48 var(--font); }
.card.flash-card .hl { font-size: 1.18em; }

.outro-mark { color: var(--brand); font: 900 112px/1.1 var(--font); letter-spacing: -.02em; }
.has-recap .outro-mark { font-size: 84px; }
.outro-rule { width: 104px; height: 10px; border-radius: 99px; background: var(--brand); margin: 36px 0 30px; }
.recap { margin-bottom: 34px; }
.recap-label { color: var(--muted); font: 800 28px/1 var(--font); letter-spacing: .08em; margin-bottom: 18px; }
.recap ol { list-style: none; display: flex; flex-direction: column; gap: 14px; }
.recap li { display: flex; align-items: flex-start; gap: 16px; }
.recap .tag { flex: 0 0 auto; margin-top: 4px; padding: 6px 12px 7px; border-radius: 10px; background: var(--head); color: #fff; font: 900 24px/1 var(--font); letter-spacing: .06em; }
.recap .tag.flash { background: var(--flash); }
.recap .t { font: 700 32px/1.36 var(--font); color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.outro-text { font: 800 48px/1.4 var(--font); color: var(--ink); }

.captions { position: absolute; left: var(--safe-l); right: var(--safe-r); top: 1372px; z-index: 60; text-align: center; }
.cap { position: absolute; left: 0; right: 0; top: 0; text-align: center; opacity: 0; visibility: hidden; }
/* One rounded box per caption (not one box per line), centred under the content. */
.cap > span { display: inline-block; max-width: 100%; font: 800 46px/1.42 var(--font); color: #fff; background: rgba(31,38,41,.93); padding: 10px 24px 12px; border-radius: 14px; }

.hook-title, .story-title, .keyfact p, .card p, .card h3, .cap > span, .recap .t { text-wrap: balance; }
.w { white-space: nowrap; }
</style>

<script id="layout-script">
/* Layout prepass. Runs once in headless Chrome (see render.py); the result is
   serialized back into index.html, so the render page never measures text. */
(function () {
  if (location.hash !== "#layout") return;
  const self = document.getElementById("layout-script");
  const seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("zh", { granularity: "word" }) : null;
  const ASCII = /^[A-Za-z0-9.\-+%#_/$]+$/, NUMERAL = /^([0-9]+(\.[0-9]+)?|[一二三四五六七八九十百千万两几]+)$/, MEASURE = /^[个款家倍条项位名亿万次年月日天层份张]$/;
  const MAX_PER_PAGE = 4;
  const PUNCT = /^[，。！？、：；,.!?:;”’）)》」』%％]+$/, OPEN = /^[“‘（(《「『]+$/, HAN = /^[一-鿿]+$/, HAN1 = /^[一-鿿]$/;
  const SUFFIX = /^[版型级量率性者商端侧式类款化家方额费价值]$/, PREFIX = /^[大小新超总副前首老]$/, PARTICLE = /^[的了着过地得们]$/;
  const words = (text) => {
    if (!seg) return [text];
    const out = [];
    let pairOpen = false;  // the last pushed word is a single Han char that may pair with the next one
    let openQuote = false; // the last pushed word is an opening quote/bracket that must stay with the next word
    for (const { segment } of seg.segment(text)) {
      const prev = out[out.length - 1];
      const glue = prev && !/\s/.test(segment) && (
        (ASCII.test(prev) && ASCII.test(segment)) || (NUMERAL.test(prev) && MEASURE.test(segment)) || PUNCT.test(segment) || openQuote ||
        // single-character suffixes and particles stay with the word before them (量化版, 预期的)
        (HAN.test(prev) && (SUFFIX.test(segment) || PARTICLE.test(segment))) ||
        // single-character prefixes stay with the word after them (大模型, 新功能)
        (PREFIX.test(prev.slice(-1)) && prev.length === 1 && HAN.test(segment)));
      if (glue) { out[out.length - 1] = prev + segment; pairOpen = false; openQuote = OPEN.test(segment); continue; }
      // ICU's Chinese dictionary misses many tech words (开源, 九个…): pair up runs of single Han characters.
      if (prev && pairOpen && HAN1.test(segment)) { out[out.length - 1] = prev + segment; pairOpen = false; continue; }
      out.push(segment);
      pairOpen = HAN1.test(segment);
      openQuote = OPEN.test(segment);
    }
    // Keep short multi-word English names together ("Hugging Face", "Mistral Large 4", "The Information").
    const merged = [];
    for (let i = 0; i < out.length; i++) {
      const a = merged[merged.length - 1], sp = out[i], b = out[i + 1];
      if (a && sp === " " && b && /[A-Za-z0-9]$/.test(a) && /^[A-Z0-9]/.test(b) && /^[A-Z]/.test(a.split(" ")[0]) && ASCII.test(b.replace(/[，。、：；,.;:]+$/, "")) && (a + " " + b).length <= 18) {
        merged[merged.length - 1] = a + "\u00a0" + b; i++; continue;
      }
      merged.push(sp);
    }
    return merged;
  };
  const wrapWords = (el) => {
    [...el.childNodes].forEach((child) => {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const segment of words(child.textContent)) {
          if (/^\s+$/.test(segment)) { frag.appendChild(document.createTextNode(segment)); continue; }
          const span = document.createElement("span"); span.className = "w"; span.textContent = segment; frag.appendChild(span);
        }
        child.replaceWith(frag);
      } else if (child.nodeType === 1 && !child.classList.contains("w")) wrapWords(child);
    });
  };
  const fit = (el) => {
    const max = +el.dataset.max, min = +el.dataset.min, lines = +el.dataset.lines;
    for (let size = max; size >= min; size -= 2) {
      el.style.fontSize = size + "px";
      const lh = parseFloat(getComputedStyle(el).lineHeight);
      if (el.scrollHeight <= lh * lines + 2 && el.scrollWidth <= el.clientWidth + 1) break;
    }
  };
  const run = () => {
    const report = { scenes: [] };
    document.querySelectorAll(".scene").forEach((scene) => { scene.style.visibility = "visible"; scene.style.opacity = "1"; });
    document.querySelectorAll(".hook-title, .story-title, .keyfact p, .card h3, .card p, .cap span, .recap .t").forEach(wrapWords);
    document.querySelectorAll(".fit").forEach(fit);
    document.querySelectorAll(".scene.kind-story").forEach((scene) => {
      const body = scene.querySelector(".body"), cards = scene.querySelector(".cards"), inner = scene.querySelector(".cards-inner");
      const all = [...inner.querySelectorAll(".card")];
      const gap = () => parseFloat(getComputedStyle(inner).rowGap) || 0;
      const avail = () => body.getBoundingClientRect().bottom - 40 - inner.getBoundingClientRect().top;
      // Each card is expanded once while the rest of its page is collapsed, so a page fits when
      // (sum of collapsed heights) - collapsed[k] + expanded[k] fits for every card k on it.
      const measure = () => all.map((card) => {
        card.classList.remove("is-collapsed"); const open = card.getBoundingClientRect().height;
        card.classList.add("is-collapsed"); const shut = card.getBoundingClientRect().height;
        card.classList.remove("is-collapsed"); return { open, shut };
      });
      const fits = (sizes, idx) => {
        const shut = idx.reduce((a, i) => a + sizes[i].shut, 0) + gap() * (idx.length - 1);
        return idx.every((i) => shut - sizes[i].shut + sizes[i].open <= avail());
      };
      const paginate = (sizes) => {
        const pages = []; let cur = [];
        sizes.forEach((_, i) => {
          const next = [...cur, i];
          if (cur.length && (next.length > MAX_PER_PAGE || !fits(sizes, next))) { pages.push(cur); cur = [i]; } else cur = next;
        });
        if (cur.length) pages.push(cur);
        // Rebalance (5 cards -> 3 + 2, not 4 + 1) when the even split still fits.
        const n = sizes.length, p = pages.length, even = [];
        let k = 0;
        for (let j = 0; j < p; j++) { const size = Math.ceil((n - k) / (p - j)); even.push([...Array(size).keys()].map((x) => x + k)); k += size; }
        return even.every((idx) => fits(sizes, idx)) ? even : pages;
      };
      let sizes = measure();
      if (sizes.some((s) => s.open > avail())) { cards.classList.add("compact"); sizes = measure(); }
      const pages = paginate(sizes);
      pages.forEach((idx, page) => idx.forEach((i) => { all[i].dataset.page = String(page); }));
      cards.dataset.pages = String(pages.length);
      if (pages.length > 1) {
        const dots = document.createElement("div"); dots.className = "page-dots";
        for (let i = 0; i < pages.length; i++) { const d = document.createElement("i"); d.dataset.dot = String(i); dots.appendChild(d); }
        cards.after(dots);
      }
      report.scenes.push({ id: scene.id, pages: pages.length, per_page: pages.map((x) => x.length), compact: cards.classList.contains("compact") });
    });
    // Captions: measure each one (all are stacked at the same spot) and report any that need a third line.
    const capLines = [];
    document.querySelectorAll(".cap").forEach((cap) => {
      cap.style.visibility = "visible";
      const span = cap.firstElementChild, lh = parseFloat(getComputedStyle(span).lineHeight);
      if (span.getBoundingClientRect().height > lh * 2 + 30) capLines.push(cap.textContent.slice(0, 24));
      // Shrink-wrap the box to its widest balanced line (an inline-block keeps the full width otherwise).
      const range = document.createRange(); range.selectNodeContents(span);
      const rects = [...range.getClientRects()];
      if (rects.length) {
        const width = Math.max(...rects.map((r) => r.right)) - Math.min(...rects.map((r) => r.left));
        const pad = parseFloat(getComputedStyle(span).paddingLeft) + parseFloat(getComputedStyle(span).paddingRight);
        span.style.width = Math.ceil(width + pad + 2) + "px";
      }
      cap.style.visibility = "";
    });
    report.caption_overflow = capLines;
    const overflow = [...document.querySelectorAll(".fit, .card p, .keyfact p, .subject, .recap .t")].filter((e) => e.scrollWidth > e.clientWidth + 1).map((e) => e.textContent.slice(0, 24));
    report.overflow = overflow;
    document.querySelectorAll(".scene").forEach((scene) => { scene.style.visibility = ""; scene.style.opacity = ""; });
    document.documentElement.dataset.layout = JSON.stringify(report);
    self.remove();
  };
  document.fonts.ready.then(() => setTimeout(run, 50));
})();
</script>

<script id="timeline-script">
/* Deterministic timeline: seek(t) sets every visual state from scratch. */
(function () {
  const DATA = JSON.parse(document.getElementById("v6-data").textContent);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = (p) => 1 - Math.pow(1 - clamp(p), 3);
  const scenes = DATA.scenes.map((s) => ({ ...s, el: document.getElementById(s.scene_id) }));
  const caps = [...document.querySelectorAll(".cap")].map((el) => ({ el, start: +el.dataset.start, end: +el.dataset.end }));
  const progress = [...document.querySelectorAll(".chrome .progress")].map((el) => ({ el, id: el.dataset.for }));
  const TRANSITION = 0.32;
  const show = (el, p, dy = 26) => { el.style.opacity = String(ease(p)); el.style.transform = `translate3d(0, ${(1 - ease(p)) * dy}px, 0)`; };
  function cards(el, s, t, local) {
    const events = (DATA.card_events[s.scene_id] || []);
    const list = [...el.querySelectorAll(".card")];
    const accordion = s.kind === "story";
    let active = 0, activeStart = s.start, prev = 0;
    events.forEach((ev) => { if (t >= ev.start - 0.12 && ev.card !== active) { prev = active; active = ev.card; activeStart = ev.start - 0.12; } });
    if (!active) active = 1;  // before the first sentence the first card is already open
    const page = +(list[active - 1]?.dataset.page || 0);
    const firstSeen = {};
    events.forEach((ev) => { if (!(ev.card in firstSeen)) firstSeen[ev.card] = ev.start; });
    const onPage = list.filter((c) => +(c.dataset.page || 0) === page);
    const pageStart = Math.min(...onPage.map((c) => firstSeen[list.indexOf(c) + 1] ?? s.start)) - 0.25;
    const pageIn = page === 0 ? (local - 0.25) : (t - pageStart);
    const open = ease((t - activeStart) / 0.32);
    list.forEach((card, k) => {
      const n = k + 1;
      card.style.display = +(card.dataset.page || 0) === page ? "" : "none";
      if (accordion) {
        // whole page fades in together (staggered); upcoming cards dimmer than finished ones
        const p = clamp((pageIn - k * 0.06) / 0.35);
        const dim = n === active ? 1 : (n < active ? 0.78 : 0.5);
        card.style.opacity = String(ease(p) * dim);
        card.style.transform = `translate3d(0, ${(1 - ease(p)) * 24}px, 0)`;
        const more = card.querySelector(".more");
        const rows = n === active ? open : (n === prev ? 1 - open : 0);
        if (more) more.style.gridTemplateRows = `${rows.toFixed(3)}fr`;
      } else {
        // flash: cards appear as the narration reaches them
        const appear = (firstSeen[n] ?? s.start + 0.4) - 0.12;
        const shown = t >= appear || (n === 1 && local >= 0.4);
        const p = shown ? (t - Math.max(appear, s.start + 0.3)) / 0.35 : 0;
        card.style.opacity = shown ? String(ease(p) * (n < active ? 0.78 : 1)) : "0";
        card.style.transform = `translate3d(0, ${(1 - ease(p)) * 30}px, 0)`;
      }
      card.classList.toggle("is-speaking", n === active);
    });
    el.querySelectorAll(".page-dots i").forEach((dot) => dot.classList.toggle("on", +dot.dataset.dot === page));
  }
  function seek(t) {
    let current = 0;
    scenes.forEach((s, i) => {
      if (t >= s.start) current = i;
      const el = s.el; if (!el) return;
      const nextStart = i + 1 < scenes.length ? scenes[i + 1].start : Infinity;
      const visible = t >= s.start && t < nextStart + TRANSITION;
      el.style.visibility = visible ? "visible" : "hidden";
      el.style.zIndex = String(10 + i);
      if (!visible) { el.style.opacity = "0"; return; }
      const local = t - s.start;
      const enter = i === 0 ? 1 : clamp(local / TRANSITION);
      el.style.opacity = String(ease(enter));
      el.style.transform = i === 0 ? "none" : `translate3d(0, ${(1 - ease(enter)) * 40}px, 0)`;
