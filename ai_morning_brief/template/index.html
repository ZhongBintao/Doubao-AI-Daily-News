      };
      sceneSpecs.forEach((scene, i) => {
        const root = `#${scene.id}`;
        const previous = i > 0 ? `#${sceneSpecs[i - 1].id}` : null;
        const transitionStart = scene.start;
        if (i === 0) tl.from(root, { y: 18, opacity: 0, duration: .56, ease: "sine.out" }, .12);
        else { if (previous) tl.set(previous, { autoAlpha: 0 }, transitionStart); tl.to(root, { autoAlpha: 1, duration: .38, ease: "power3.out" }, transitionStart + .02); }
        if (scene.kind === "intro") {
          tl.from(root + " .hero-rule", { scale: .35, opacity: 0, duration: .42, ease: "back.out(1.15)" }, .18);
          tl.from(root + " .hero-kicker", { y: 20, opacity: 0, duration: .34, ease: "sine.out" }, .28);
          tl.from(root + " .hero-title", { y: 42, opacity: 0, duration: .72, ease: "power3.out" }, .38);
        } else if (scene.kind === "overview") {
          tl.to(".top-nav", { autoAlpha: 1, duration: .3, ease: "power3.out" }, transitionStart + .04);
          tl.from(root + " .overview-heading", { y: 28, opacity: 0, duration: .5, ease: "power3.out" }, transitionStart + .17);
          tl.from(root + " .overview-card", { y: 24, opacity: 0, duration: .42, stagger: .08, ease: "sine.out" }, transitionStart + .36);
        } else if (scene.kind === "news") {
          tl.to(".top-nav", { autoAlpha: 1, duration: .3, ease: "power3.out" }, transitionStart + .04);
          tl.from(root + " .detail-heading", { y: 30, opacity: 0, duration: .5, ease: "expo.out" }, transitionStart + .16);
          tl.from(root + " .point-card", { y: 28, opacity: 0, duration: .46, stagger: .08, ease: "power2.out" }, transitionStart + .34);
        } else if (scene.kind === "outro") {
          tl.set(".top-nav", { autoAlpha: 0 }, transitionStart);
          tl.from(root + " .hero-rule", { scale: .35, opacity: 0, duration: .46, ease: "back.out(1.1)" }, transitionStart + .18);
          tl.from(root + " .hero-title", { y: 46, opacity: 0, duration: .78, ease: "power3.out" }, transitionStart + .34);
        }
      });
      captionSpecs.forEach((cue, i) => {
        const node = `#caption-${String(i + 1).padStart(4, "0")}`; const el = document.querySelector(node);
        if (el && window.__hyperframes && window.__hyperframes.fitTextFontSize) { const fitted = window.__hyperframes.fitTextFontSize(el.textContent || "", { maxWidth: 1580, baseFontSize: 48, minFontSize: 40, fontFamily: "Noto Sans SC", fontWeight: 700, step: 2 }); if (fitted && fitted.fontSize) el.style.fontSize = `${fitted.fontSize}px`; }
        tl.set(node, { display: "block", autoAlpha: 1 }, Math.max(.001, cue.start)); tl.set(node, { display: "none", autoAlpha: 0 }, cue.end);
      });
      window.__timelines["root"] = tl;
    </script>
  </div>
